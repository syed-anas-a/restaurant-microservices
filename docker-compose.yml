services:               
  db:
    image: postgres:17
    env_file: .env
    environment:                  
      POSTGRES_DB: restaurant_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s 
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.0
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic order.placed --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic delivery.status_changed --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  auth-service:
    build:
      context: .      
      dockerfile: auth_service/Dockerfile 
    ports:
      - "8001:8001"
    env_file: auth_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,auth-service  
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy
  
  menu-service:
    build:
      context: .
      dockerfile: menu_service/Dockerfile
    ports:
      - "8002:8002"
    env_file: menu_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,menu-service
      AUTH_SERVICE_URL: http://auth-service:8001
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: cart_service/Dockerfile
    ports:
      - "8003:8003"
    env_file: cart_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,cart-service
      AUTH_SERVICE_URL: http://auth-service:8001
      MENU_SERVICE_URL: http://menu-service:8002
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    ports:
      - "8004:8004"
    env_file: order_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,order-service
      AUTH_SERVICE_URL: http://auth-service:8001
      MENU_SERVICE_URL: http://menu-service:8002
      CART_SERVICE_URL: http://cart-service:8003
      CELERY_BROKER_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  celery-worker:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    command: celery -A order_service worker -l info
    env_file: order_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-consumer:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    command: python manage.py consumer_delivery_events
    env_file: order_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  delivery-service:
    build:
      context: .
      dockerfile: delivery_service/Dockerfile
    ports:
      - "8005:8005"
    env_file: delivery_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,delivery-service
      AUTH_SERVICE_URL: http://auth-service:8001
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  delivery-consumer:
    build:
      context: .
      dockerfile: delivery_service/Dockerfile
    command: python manage.py consume_order_events
    env_file: delivery_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully


volumes:
  postgres_data: