services:               
  db:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_DB: restaurant_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .      
      dockerfile: auth_service/Dockerfile 
    ports:
      - "8001:8001"
    env_file: auth_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,auth-service  
    depends_on:
      db:
        condition: service_healthy
  
  menu-service:
    build:
      context: .
      dockerfile: menu_service/Dockerfile
    ports:
      - "8002:8002"
    env_file: menu_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,menu-service
      AUTH_SERVICE_URL: http://auth-service:8001
    depends_on:
      db:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: cart_service/Dockerfile
    ports:
      - "8003:8003"
    env_file: cart_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,cart-service
      AUTH_SERVICE_URL: http://auth-service:8001
      MENU_SERVICE_URL: http://menu-service:8002
    depends_on:
      db:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    ports:
      - "8004:8004"
    env_file: order_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,order-service
      AUTH_SERVICE_URL: http://auth-service:8001
      MENU_SERVICE_URL: http://menu-service:8002
      CART_SERVICE_URL: http://cart-service:8003
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  celery-worker:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    command: celery -A order_service worker -l info
    env_file: order_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      dockerfile: delivery_service/Dockerfile
    ports:
      - "8005:8005"
    env_file: delivery_service/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,delivery-service
      AUTH_SERVICE_URL: http://auth-service:8001
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: