x-django-env: &django-env
  DEBUG: ${DEBUG:-True}
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

x-auth-url: &auth-url
  AUTH_SERVICE_URL: http://auth-service:8001

x-internal-token: &internal-token
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token}

x-order-env: &order-env
  <<: [*django-env, *auth-url, *internal-token]
  DB_NAME: restaurant_orders
  SECRET_KEY: ${ORDER_SECRET_KEY:-dev-insecure-order-secret-key}
  MENU_SERVICE_URL: http://menu-service:8002
  CART_SERVICE_URL: http://cart-service:8003
  CELERY_BROKER_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  EMAIL_USE_SMTP: ${EMAIL_USE_SMTP:-False}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-orders@restaurant.local}

x-delivery-env: &delivery-env
  <<: [*django-env, *auth-url]
  DB_NAME: restaurant_delivery
  SECRET_KEY: ${DELIVERY_SECRET_KEY:-dev-insecure-delivery-secret-key}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:               
  db:
    image: postgres:17
    environment:                  
      POSTGRES_DB: restaurant_auth
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s 
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.0
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic order.placed --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092 &&
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic delivery.status_changed --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  auth-service:
    build:
      context: .      
      dockerfile: auth_service/Dockerfile 
    ports:
      - "8001:8001"
    environment:
      <<: *django-env
      SECRET_KEY: ${AUTH_SECRET_KEY:-dev-insecure-auth-secret-key}
      DB_NAME: restaurant_auth
      ALLOWED_HOSTS: localhost,127.0.0.1,auth-service
      RUN_MIGRATIONS: 1
      SEED_DATA: ${SEED_DATA:-1}
      SEED_COMMAND: seed_users
      SEED_PASSWORD: ${SEED_PASSWORD:-restaurant123}
    depends_on:
      db:
        condition: service_healthy
  
  menu-service:
    build:
      context: .
      dockerfile: menu_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      <<: [*django-env, *auth-url]
      DB_NAME: restaurant_menu
      SECRET_KEY: ${MENU_SECRET_KEY:-dev-insecure-menu-secret-key}
      ALLOWED_HOSTS: localhost,127.0.0.1,menu-service
      RUN_MIGRATIONS: 1
      SEED_DATA: ${SEED_DATA:-1}
      SEED_COMMAND: seed_menu
    depends_on:
      db:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: cart_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      <<: [*django-env, *auth-url, *internal-token]
      DB_NAME: restaurant_cart
      SECRET_KEY: ${CART_SECRET_KEY:-dev-insecure-cart-secret-key}
      ALLOWED_HOSTS: localhost,127.0.0.1,cart-service
      MENU_SERVICE_URL: http://menu-service:8002
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      <<: *order-env
      ALLOWED_HOSTS: localhost,127.0.0.1,order-service
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  celery-worker:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    command: celery -A order_service worker -l info
    environment: *order-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-consumer:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    command: python manage.py consumer_delivery_events
    environment: *order-env
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  delivery-service:
    build:
      context: .
      dockerfile: delivery_service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      <<: *delivery-env
      ALLOWED_HOSTS: localhost,127.0.0.1,delivery-service
      RUN_MIGRATIONS: 1
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  delivery-consumer:
    build:
      context: .
      dockerfile: delivery_service/Dockerfile
    command: python manage.py consume_order_events
    environment: *delivery-env
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully


volumes:
  postgres_data: